<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🛒 Mini Store</h1>
  </header>

  <main>
    <section>
      <h2>Products</h2>
      <div id="products"></div>
    </section>

    <section id="cart-section">
      <h2>Your Cart</h2>
      <div id="cart"></div>
      <h3 id="total"></h3>

      <h2>Checkout</h2>
      <form id="checkout-form" onsubmit="checkout(event)">
        <input type="text" id="name" placeholder="Full name" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="card" placeholder="card number" required>
        <p style="font-size:12px; color:gray;">Demo only. Koi real payment nahi hoti. Real card number mat daaliye.</p>
        <button type="submit" class="pay">Pay Now</button>
      </form>
      <p id="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
